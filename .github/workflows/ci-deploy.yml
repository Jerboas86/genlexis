name: CI and Deploy

on:
  push:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: 0
      ORIGIN: https://genlexis.com
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_GENLEXIS_TEST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Doppler
        uses: dopplerhq/cli-action@v3

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps

      - name: Lint
        run: pnpm lint

      - name: Test
        run: doppler run -- pnpm test:run

      - name: Build
        run: pnpm build
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_GENLEXIS }}

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: 0
      ORIGIN: https://genlexis.com

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Doppler
        uses: dopplerhq/cli-action@v3

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps

      - name: Lint
        run: pnpm lint

      - name: Test
        run: doppler run -- pnpm test:run
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_GENLEXIS_TEST }}

      - name: Build
        run: doppler run -- pnpm build
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_GENLEXIS }}

      - name: Send to Cloudflare Worker
        run: doppler run -- pnpm exec wrangler deploy
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_GENLEXIS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
