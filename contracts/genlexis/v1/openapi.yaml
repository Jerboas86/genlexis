# The Genlexis material contract, version 1.
#
# This document is the *only* interface shared between the Genlexis and Helixum
# repositories. Neither the Genlexis database schema nor the TypeScript types of
# `@genlexis/core` are part of it, and Helixum never installs the engine.
#
# Every structure is closed (`additionalProperties: false`). A field the schema
# does not know is an error, not a value to ignore: an ignored field can change
# the meaning of a request without either side noticing.
#
# **Genlexis delivers linguistic material, not audio.** It says which sentences,
# drawn from which pool, under which seed. Turning those into sound — synthesis,
# level measurement, the masker and the gain rule that realises the SNR — belongs
# to the audio chain, and the immutable, hash-verified assets that a clinical
# record can cite by bytes are Voxa's job. Building a second, transitional asset
# pipeline here would be throwaway infrastructure for material that, by
# `genlexis-helixum-consumption.md` §7.5, never anchors a longitudinal curve.
openapi: 3.1.0
info:
  title: Genlexis material API
  version: "1.0.0"
  summary: Versioned speech material draws.
  description: |
    A caller asks for a *draw* by naming a **protocol revision** — never by
    passing clinical generation parameters. The service resolves that revision to
    an immutable configuration (language, pattern, lexical density, item count,
    seed policy, pool revision, phoneme tolerance) and runs the engine against
    the snapshot it fixes.

    A caller also passes the recent `drawId`s to exclude. An excluded draw
    excludes **every `(itemId, itemRevision)` it contains**, not merely its
    identifier: a new `drawId` that reused one of those stimuli would not be a
    rotation.
  license:
    name: AGPL-3.0-only

servers:
  - url: https://api.genlexis.com
    description: production
  - url: https://api.test.genlexis.com
    description: test

security:
  - materialAuth: []

paths:
  /v1/draws:
    post:
      operationId: createDraw
      summary: Draw material for one session.
      description: |
        Idempotent under `idempotencyKey`. The service stores the canonical
        fingerprint of the request — contract version, protocol revision, and the
        sorted, de-duplicated set of excluded draw ids — beside the result. The
        same key with the same fingerprint returns exactly the same draw; the
        same key with any other fingerprint returns `idempotency_conflict`.

        The key travels in the body and **only** there. Carrying it in an
        `Idempotency-Key` header as well would mean two places that must agree,
        and a rule that they must — which is a failure mode rather than a
        convention.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DrawRequest" }
      responses:
        "200":
          description: The draw for this idempotency key, replayed or freshly produced.
          headers:
            Cache-Control: { schema: { type: string, const: "no-store" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draw" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/pools/{protocolRevision}:
    get:
      operationId: getPool
      summary: Describe the whole pool a protocol revision draws from.
      description: |
        Every sentence a draw under this revision can serve — every variant of
        every pair, not one per pair — each token with the lexical entry it was
        built from. For a consumer that studies its material: models difficulty
        from the words, simulates sessions on the real universe, checks that its
        draws are samples of it. It is never a substitute for a draw and records
        no session.

        The pool is named by a protocol revision, as a draw is, and lists exactly
        what a draw under it may serve: the same filters, and the same rule that
        a sentence whose transcriptions yield no phoneme is not drawable. An item
        carries the identity a draw gives it, so the same sentence is
        recognisably one in both.

        The request has no body: it is signed like a draw, over an empty last
        field.
      parameters:
        - name: protocolRevision
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ProtocolRevision" }
      responses:
        "200":
          description: The pool, as the corpus stands.
          headers:
            Cache-Control: { schema: { type: string, const: "no-store" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pool" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/Unavailable" }

components:
  securitySchemes:
    materialAuth:
      type: http
      scheme: bearer
      description: |
        A shared secret held in the caller's secret manager, presented as a
        bearer token and accompanied by `X-Genlexis-Timestamp` and
        `X-Genlexis-Signature`. Two secrets are accepted at once so a rotation
        never has a gap.

        **The canonical request.** The signature is an HMAC-SHA-256, lowercase
        hex, over four fields joined by a single `\n`:

        ```
        METHOD      upper case, e.g. POST
        PATH        no query string, no host, e.g. /v1/draws
        TIMESTAMP   seconds since the epoch, as decimal text
        BODY        verbatim, exactly as transmitted; empty for a GET
        ```

        The body is signed **as sent**. Re-serialising it before signing, or
        before verifying, compares a normalised form against a signature taken
        over the original, and the two differ on nothing more than key order.

        Signing only the bearer would leave a captured request replayable
        against another path or with an edited body; the timestamp is what bounds
        replay of the signature itself. A server accepts a skew of 300 seconds.

        `fixtures/signature-vector.json` pins this with a worked example — a test
        secret, a request, and the signature both sides must produce. It is the
        one part of this contract that no response fixture can check, because
        each side builds it independently and a divergence leaves every test
        green on both.

  responses:
    BadRequest:
      description: Malformed body, unknown field, or unsupported contract version.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, expired or invalid server-to-server credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The idempotency key was reused with a different fingerprint.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: The request is well formed but cannot produce a draw.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Quota exceeded.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: |
        The service cannot answer. The caller must fail closed — falling back to
        historic fixed lists would silently change the condition under test.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    IdempotencyKey:
      type: string
      pattern: "^[0-9a-f]{64}$"
      description: 64 lowercase hex characters — an HMAC digest, never a session id.

    DrawId:
      type: string
      description: |
        Opaque, random, non-derivable and stable. It is a linguistic reference —
        Genlexis can resolve it to exact items — so it never appears in a
        plaintext header on the Helixum side.
      pattern: "^[0-9a-f]{32}$"

    ContractVersion:
      type: string
      const: "1"

    ProtocolRevision:
      type: string
      description: |
        Names an immutable configuration. There is no implicit "latest": changing
        the pool or the generation policy requires publishing a new configuration
        and a new protocol revision before it can be asked for.
      pattern: "^[a-z0-9][a-z0-9._-]{0,62}[a-z0-9]$"

    DrawRequest:
      type: object
      additionalProperties: false
      required: [contractVersion, protocolRevision, idempotencyKey, excludedDrawIds]
      properties:
        contractVersion: { $ref: "#/components/schemas/ContractVersion" }
        protocolRevision: { $ref: "#/components/schemas/ProtocolRevision" }
        idempotencyKey: { $ref: "#/components/schemas/IdempotencyKey" }
        excludedDrawIds:
          type: array
          description: |
            Recent draws of the same protocol identity. Canonicalised by the
            service — sorted and de-duplicated — before it fingerprints them, so
            reordering the array is not a different request.
          maxItems: 64
          items: { $ref: "#/components/schemas/DrawId" }

    MaterialRelease:
      type: object
      additionalProperties: false
      required: [sourceId, revision, poolRevision]
      properties:
        sourceId:
          type: string
          description: Stable identifier of the material source. Never a Voxa `corpusId`.
          minLength: 1
          maxLength: 128
        revision:
          type: string
          description: Immutable release revision. A correction publishes a new one.
          minLength: 1
          maxLength: 64
        poolRevision:
          type: string
          description: |
            The immutable revision of the accepted pool the draw ran against.
            A seed alone does not make a draw replayable: the same seed against a
            changed pool produces different sentences.
          minLength: 1
          maxLength: 64

    GenerationOptions:
      type: object
      additionalProperties: false
      required: [pattern, lexicalDensity, itemsPerList, listCount]
      properties:
        pattern:
          type: string
          enum: [noun, det_noun, det_noun_adj, np_verb]
        lexicalDensity:
          type: string
          enum: [high, medium, low]
        itemsPerList: { type: integer, minimum: 1, maximum: 128 }
        listCount: { type: integer, minimum: 1, maximum: 1 }
        detType: { type: string, enum: [definite, indefinite] }
        gender: { type: string, enum: [m, f] }
        grammNumber: { type: string, enum: [s, p] }
        lengthUnit: { type: string, enum: [syllables, phonemes] }
        length: { type: integer, minimum: 1, maximum: 64 }

    DrawToken:
      type: object
      additionalProperties: false
      required: [position, slot, surface]
      description: |
        One token of an item, as the corpus built it. Its role is what lets a
        consumer score some words and not others — the content words without the
        determiner. An elided determiner is a token of its own (`l'`) even where
        the text writes it against its noun.
      properties:
        position: { type: integer, minimum: 1, description: 1-based, in sentence order. }
        slot: { type: string, enum: [det, noun, adj, verb] }
        surface: { type: string, minLength: 1, maxLength: 128 }

    DrawItem:
      type: object
      additionalProperties: false
      required: [itemId, itemRevision, text, homonyms, tokens]
      properties:
        itemId: { type: string, minLength: 1, maxLength: 128 }
        itemRevision:
          type: string
          description: |
            Changing the text or the metadata of an item creates a new revision.
            It never retroactively changes a release that cites the old one.
          minLength: 1
          maxLength: 64
        text: { type: string, minLength: 1, maxLength: 512 }
        homonyms:
          type: array
          maxItems: 32
          items: { type: string, minLength: 1, maxLength: 128 }
        tokens:
          type: array
          minItems: 1
          maxItems: 16
          items: { $ref: "#/components/schemas/DrawToken" }

    DrawGeneration:
      type: object
      additionalProperties: false
      required:
        [seed, options, selection, phonemeBalanceDistance, phonemeBalanceTolerance]
      description: >
        How the list was selected. `balanced` lists are chosen to approach the
        language's phoneme distribution and are refused above the revision's
        tolerance. `uniform` lists are a simple random sample without
        replacement, in the seed's order: the phoneme-balance distance is still
        computed and reported, as a diagnostic, and no tolerance applies — so
        `phonemeBalanceTolerance` is `null` if and only if `selection` is
        `uniform`.
      properties:
        seed: { type: string, minLength: 1, maxLength: 128 }
        options: { $ref: "#/components/schemas/GenerationOptions" }
        selection: { type: string, enum: [balanced, uniform] }
        phonemeBalanceDistance: { type: number, minimum: 0 }
        phonemeBalanceTolerance:
          oneOf:
            - { type: number, minimum: 0 }
            - { type: "null" }

    Draw:
      type: object
      additionalProperties: false
      required:
        [contractVersion, drawId, protocolRevision, materialRelease, language,
         generation, items, issuedAt]
      properties:
        contractVersion: { $ref: "#/components/schemas/ContractVersion" }
        drawId: { $ref: "#/components/schemas/DrawId" }
        protocolRevision: { $ref: "#/components/schemas/ProtocolRevision" }
        materialRelease: { $ref: "#/components/schemas/MaterialRelease" }
        language: { type: string, minLength: 2, maxLength: 16 }
        generation: { $ref: "#/components/schemas/DrawGeneration" }
        items:
          type: array
          minItems: 1
          maxItems: 128
          items: { $ref: "#/components/schemas/DrawItem" }
        issuedAt:
          type: integer
          description: Epoch milliseconds.
          minimum: 0

    PoolFilters:
      type: object
      additionalProperties: false
      required: [pattern, lexicalDensity]
      description: The filters the revision fixes; an absent one was not applied.
      properties:
        pattern:
          type: string
          enum: [noun, det_noun, det_noun_adj, np_verb]
        lexicalDensity:
          type: string
          enum: [high, medium, low]
        detType: { type: string, enum: [definite, indefinite] }
        gender: { type: string, enum: [m, f] }
        grammNumber: { type: string, enum: [s, p] }
        lengthUnit: { type: string, enum: [syllables, phonemes] }
        length: { type: integer, minimum: 1, maximum: 64 }

    LexicalProperties:
      type: object
      additionalProperties: false
      description: |
        One word's entry in the lexicon, named after the lexicon's own columns
        rather than after an interpretation of them: a consumer that models
        difficulty chooses its own reading. Every field but `source` is `null`
        when the lexicon has no value.
      required:
        [source, lemma, category, gender, number, verbInfo, frequency, frequencyOrtho,
         frequencyLemma, cdOrtho, phono, phonoIpa, letterCount, phonemeCount,
         syllableCount, syllPhono, cvPhono, old20, pld20, voisOrtho, voisPhono,
         homographCount, homophoneCount, puOrtho, puPhon, preval, prevalCount, rtFlp,
         zrtFlp, errFlp]
      properties:
        source:
          type: string
          description: The lexicon the entry comes from, e.g. `lexique4`.
          minLength: 1
          maxLength: 64
        lemma: { type: [string, "null"] }
        category: { type: [string, "null"] }
        gender: { type: [string, "null"] }
        number: { type: [string, "null"] }
        verbInfo: { type: [string, "null"] }
        frequency: { type: [number, "null"] }
        frequencyOrtho: { type: [number, "null"] }
        frequencyLemma: { type: [number, "null"] }
        cdOrtho: { type: [number, "null"] }
        phono:
          type: [string, "null"]
          description: The lexicon's own notation, one symbol per phoneme.
        phonoIpa: { type: [string, "null"] }
        letterCount: { type: [integer, "null"] }
        phonemeCount: { type: [integer, "null"] }
        syllableCount: { type: [integer, "null"] }
        syllPhono: { type: [string, "null"] }
        cvPhono: { type: [string, "null"] }
        old20: { type: [number, "null"] }
        pld20: { type: [number, "null"] }
        voisOrtho: { type: [integer, "null"] }
        voisPhono: { type: [integer, "null"] }
        homographCount: { type: [integer, "null"] }
        homophoneCount: { type: [integer, "null"] }
        puOrtho: { type: [integer, "null"] }
        puPhon: { type: [integer, "null"] }
        preval: { type: [number, "null"] }
        prevalCount: { type: [integer, "null"] }
        rtFlp: { type: [number, "null"] }
        zrtFlp: { type: [number, "null"] }
        errFlp: { type: [number, "null"] }

    PoolToken:
      type: object
      additionalProperties: false
      required: [position, slot, surface, lexical]
      properties:
        position: { type: integer, minimum: 1, description: 1-based, in sentence order. }
        slot: { type: string, enum: [det, noun, adj, verb] }
        surface: { type: string, minLength: 1, maxLength: 128 }
        lexical:
          description: The token's lexical entry, or `null` when the corpus never linked one — a determiner, for instance.
          oneOf:
            - { $ref: "#/components/schemas/LexicalProperties" }
            - { type: "null" }

    PoolItem:
      type: object
      additionalProperties: false
      required: [itemId, itemRevision, text, homonyms, pairKey, tokens]
      properties:
        itemId: { type: string, minLength: 1, maxLength: 128 }
        itemRevision: { type: string, minLength: 1, maxLength: 64 }
        text: { type: string, minLength: 1, maxLength: 512 }
        homonyms:
          type: array
          maxItems: 32
          items: { type: string, minLength: 1, maxLength: 128 }
        pairKey:
          type: string
          description: |
            The unit a uniform draw samples: it keeps one variant per pair,
            chosen by its seed, so two items sharing a `pairKey` are never in the
            same draw.
          minLength: 1
          maxLength: 256
        tokens:
          type: array
          minItems: 1
          maxItems: 16
          items: { $ref: "#/components/schemas/PoolToken" }

    Pool:
      type: object
      additionalProperties: false
      required:
        [contractVersion, protocolRevision, materialRelease, language, filters, poolDigest,
         items, issuedAt]
      properties:
        contractVersion: { $ref: "#/components/schemas/ContractVersion" }
        protocolRevision: { $ref: "#/components/schemas/ProtocolRevision" }
        materialRelease: { $ref: "#/components/schemas/MaterialRelease" }
        language: { type: string, minLength: 2, maxLength: 16 }
        filters: { $ref: "#/components/schemas/PoolFilters" }
        poolDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: |
            SHA-256, lowercase hex, over the sorted `itemId@itemRevision` lines,
            one per item, each ended by a line feed. The pool revision is
            declared; this is measured — two pools with the same digest list the
            same items, whatever order they came in.
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PoolItem" }
        issuedAt:
          type: integer
          description: Epoch milliseconds.
          minimum: 0

    ErrorCode:
      type: string
      enum:
        - unsupported_contract_version
        - invalid_request
        - unauthorized
        - idempotency_conflict
        - unknown_protocol_revision
        - unknown_pool_revision
        - corpus_unavailable
        - pool_exhausted
        - balance_tolerance_exceeded
        - incomplete_draw
        - quota_exceeded
        - service_unavailable

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorCode" }
        message:
          type: string
          description: |
            Human-readable and non-normative. It never repeats the full exclusion
            list or the idempotency key.
          maxLength: 512
